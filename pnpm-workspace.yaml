  - '@solana/rpc-spec@7.1.0'
  - '@solana/rpc-subscriptions-api@7.1.0'
  - '@solana/rpc-subscriptions-channel-websocket@7.1.0'
  - '@solana/rpc-subscriptions-spec@7.1.0'
